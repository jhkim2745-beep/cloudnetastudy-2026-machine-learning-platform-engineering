<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- experimentation loop -->
  <rect x="20" y="20" width="340" height="260" rx="14" fill="#eef4fb" stroke="#4a78b5" stroke-dasharray="6 4"/>
  <text x="190" y="46" text-anchor="middle" font-weight="bold" fill="#2f5b94">실험 단계 (Experimentation)</text>
  <g fill="#fff" stroke="#4a78b5">
    <rect x="45" y="70" width="130" height="40" rx="8"/><rect x="205" y="70" width="130" height="40" rx="8"/>
    <rect x="205" y="150" width="130" height="40" rx="8"/><rect x="45" y="150" width="130" height="40" rx="8"/>
    <rect x="125" y="222" width="130" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="110" y="95">문제 정의</text><text x="270" y="95">데이터 수집·준비</text>
    <text x="270" y="175">피처 엔지니어링</text><text x="110" y="175">모델 훈련</text>
    <text x="190" y="247">평가·검증</text>
  </g>
  <g stroke="#555" fill="none" marker-end="url(#a)">
    <path d="M175 90 H203"/><path d="M270 110 V148"/><path d="M205 170 H177"/>
    <path d="M110 190 V242 H123"/><path d="M190 222 Q190 205 160 192"/>
  </g>
  <!-- handoff -->
  <path d="M362 150 H420" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="391" y="140" text-anchor="middle" font-size="12" fill="#555">모델 등록</text>
  <!-- operation loop -->
  <rect x="422" y="20" width="318" height="260" rx="14" fill="#f2f8ee" stroke="#5a9a3e" stroke-dasharray="6 4"/>
  <text x="581" y="46" text-anchor="middle" font-weight="bold" fill="#3f7a26">운영 단계 (Operation)</text>
  <g fill="#fff" stroke="#5a9a3e">
    <rect x="446" y="70" width="130" height="40" rx="8"/><rect x="590" y="70" width="130" height="40" rx="8"/>
    <rect x="590" y="150" width="130" height="40" rx="8"/><rect x="446" y="150" width="130" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="511" y="95">배포</text><text x="655" y="95">서빙 (API·배치)</text>
    <text x="655" y="175">모니터링</text><text x="511" y="175">재훈련 트리거</text>
  </g>
  <g stroke="#555" fill="none" marker-end="url(#a)">
    <path d="M576 90 H588"/><path d="M655 110 V148"/><path d="M590 170 H578"/><path d="M511 150 V112"/>
  </g>
  <text x="581" y="232" text-anchor="middle" font-size="12" fill="#555">데이터·성능 변화(드리프트)를 감지하면</text>
  <text x="581" y="250" text-anchor="middle" font-size="12" fill="#555">새 데이터로 다시 훈련해 배포</text>
</svg>
